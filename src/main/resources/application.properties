spring.application.name=MiniZalo_Backend

# Spring Data JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Datasource (PostgreSQL) - Default for local development, overridden by environment variables in Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
app.jwtSecret=${APP_JWT_SECRET}
app.access.token.expiration.minutes=60
app.refresh.token.expiration.days=${APP_REFRESH_TOKEN_EXPIRATION_DAYS}

# AWS DynamoDB Configuration (for local development)
aws.dynamodb.endpoint=${AWS_DYNAMODB_ENDPOINT}
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}

# MinIO Configuration (for local development)
minio.endpoint=${MINIO_ENDPOINT}
minio.publicUrl=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.accessKey=${MINIO_ACCESS_KEY}
minio.secretKey=${MINIO_SECRET_KEY}
minio.bucketName=${MINIO_BUCKET_NAME}

# Mail (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# File Upload Limits (đồng bộ với client: ảnh 20MB, video 200MB, file 100MB — server cho phép tối đa 220MB)
spring.servlet.multipart.max-file-size=220MB
spring.servlet.multipart.max-request-size=220MB

# Agora Configuration
agora.appId=${AGORA_APP_ID}
agora.appCertificate=${AGORA_APP_CERTIFICATE}

# eSMS.vn SMS Configuration (tùy chọn — để trống để bỏ qua khi local dev)
# Đăng ký miễn phí 50 SMS tại: https://esms.vn
# Lấy ApiKey + SecretKey tại: Dashboard → Quản lý API
esms.api.key=${ESMS_API_KEY:}
esms.secret.key=${ESMS_SECRET_KEY:}
esms.sms.type=${ESMS_SMS_TYPE:4}
esms.brandname=${ESMS_BRANDNAME:}
esms.content.template=${ESMS_CONTENT_TEMPLATE:MiniZalo - Ma OTP cua ban la: {OTP}. Co hieu luc trong 5 phut. Khong chia se ma nay cho ai.}
