version: '3.8'

services:
  minizalo-db:
    image: postgres:13-alpine
    container_name: minizalo-db
    environment:
      - POSTGRES_DB=minizalo_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - minizalo-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d minizalo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: dynamodb-local
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    env_file:
      - ./.env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://minio:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 \"$$MINIO_ACCESS_KEY\" \"$$MINIO_SECRET_KEY\"; do echo 'Waiting...'; sleep 1; done;
      /usr/bin/mc mb myminio/\"$$MINIO_BUCKET_NAME\" || true;
      /usr/bin/mc anonymous set download myminio/\"$$MINIO_BUCKET_NAME\";
      echo 'Storage Policy: PUBLIC READ-ONLY ENABLED';
      "
    env_file:
      - ./.env

  redis:
    image: redis:alpine
    container_name: minizalo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minizalo-backend:
    image: ${DOCKERHUB_USERNAME}/minizalo-backend:latest
    container_name: minizalo-backend
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://minizalo-db:5432/minizalo_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - AWS_DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - APP_JWT_SECRET=${JWT_SECRET_KEY}
      - APP_ACCESS_TOKEN_EXPIRATION_MINUTES=${APP_ACCESS_TOKEN_EXPIRATION_MINUTES}
      - APP_REFRESH_TOKEN_EXPIRATION_DAYS=${APP_REFRESH_TOKEN_EXPIRATION_DAYS}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE}
    depends_on:
      minizalo-db:
        condition: service_healthy
      dynamodb-local:
        condition: service_started
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  minizalo-db-data:
  minio-data:
  redis-data:
  dynamodb-data:
